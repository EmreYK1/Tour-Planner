<!-- frontend/src/app/components/tour-planner/tour-planner.component.html -->
<!-- Layout mit Sidebar für die geschützte Hauptansicht. -->
<div class="app-layout">
  <app-tour-list></app-tour-list>

  <main class="main-content">
    @if (showForm()) {
      <div class="form-overlay">
        <app-tour-form></app-tour-form>
      </div>
    } @else if (showLogForm()) {
      <div class="form-overlay">
        <app-tour-log-form></app-tour-log-form>
      </div>
    } @else {
      <app-tour-details></app-tour-details>
    }
  </main>
</div>
